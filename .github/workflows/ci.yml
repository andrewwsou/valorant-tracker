name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer commit on the same pull request cancels the older run. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs only read the code.
permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Production build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Fail on high or critical advisories in production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: valorant-tracker
      # The health check never calls the upstream API, so a placeholder key is enough.
      HENRIKDEV_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and start Postgres, Redis, migrations, and the app
        run: docker compose up --build --detach

      - name: Wait until the app reports healthy
        run: |
          for attempt in $(seq 1 60); do
            if body=$(curl --fail --silent http://localhost:3000/api/health) && echo "$body" | grep -q '"status":"ok"'; then
              echo "Healthy after $attempt attempt(s): $body"
              echo "Health check: \`$body\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          echo "The app never reported healthy."
          exit 1

      - name: Record the production image size
        run: |
          size=$(docker image ls --format '{{.Size}}' valorant-tracker-web)
          echo "Production image size: $size" >> "$GITHUB_STEP_SUMMARY"

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  e2e:
    name: End-to-end and load tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Compose needs a value to read its file. These tests use the mock API, never the real one.
      HENRIKDEV_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Postgres and the Redis REST proxy
        run: docker compose up --detach --wait db cache

      - name: Production build
        run: npm run build

      - name: Start the mock API and the app
        run: |
          npm run e2e:serve > e2e-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl --silent --fail http://localhost:3100/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "The test server never became healthy."
          cat e2e-server.log
          exit 1

      - name: End-to-end tests (Playwright, using the runner's Google Chrome)
        run: npx playwright test

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Load test (k6, fails if either page's p95 goes over 250 ms)
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -v "$PWD/load:/load" -e BASE_URL=http://localhost:3100 \
            grafana/k6:2.3.0 run --summary-export /load/summary.json /load/profile-load.js

      - name: Record load test results
        if: ${{ !cancelled() }}
        run: |
          [ -f load/summary.json ] || exit 0
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("load/summary.json"))["metrics"]
          print("### Load test")
          print(f"{int(m['http_reqs']['count'])} requests at {m['http_reqs']['rate']:.1f}/s, "
                f"{m['http_req_failed']['value']:.2%} failed")
          print()
          print("| Page | p50 | p95 | Max |")
          print("|---|---|---|---|")
          for page in ("profile", "leaderboard"):
              d = m.get(f"http_req_duration{{page:{page}}}")
              if d:
                  print(f"| {page} | {d['med']:.1f} ms | {d['p(95)']:.1f} ms | {d['max']:.1f} ms |")
          PY

      - name: Show server logs
        if: failure()
        run: cat e2e-server.log
