name: Nightly Sync

on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:

# One run at a time: a manual run waits for the scheduled one instead of doubling the API calls.
concurrency:
  group: nightly-sync
  cancel-in-progress: false

# The job only reads the code. It talks to the app with CRON_SECRET, not with GitHub's token.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the run if any player fails (exit 1) or the setup is wrong (exit 2).
      # The run summary lists every player's outcome.
      - name: Sync tracked players
        run: npx tsx scripts/nightly-sync.ts
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SYNC_PLAYERS: ${{ secrets.SYNC_PLAYERS }}
          SYNC_REGION: na
          SYNC_SIZE: "10"
